name: Release

# A tag like v2026.10.6 builds the bot for each platform, packages it with
# its license, and publishes a GitHub release with the archives and an
# engine manifest (engine.json, AEI's ENGINE_MANIFEST.md) giving each
# archive's digest. Controllers find the newest release through
# releases/latest/download/engine.json.
#
# Versions are the release date, vYEAR.MONTH.DAY without zero padding
# (v2026.10.6), so they read like the championship bots' names
# (bot_OpFor2010) and compare as dotted numbers. A second release on
# the same day adds a fourth number: v2026.10.6.1.
#
# Run by hand (workflow_dispatch), it builds, packages and writes the
# manifest as artifacts, without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported Ubuntu, so the binary runs on older glibc.
          - { os: ubuntu-22.04, platform: linux-x86_64, archive: tar.gz }
          - { os: windows-latest, platform: windows-x86_64, archive: zip }
          - { os: macos-latest, platform: macos-aarch64, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0

      - name: Build the bot
        run: dub build -b release --compiler="$DC"

      - name: Unit tests
        run: dub test --compiler="$DC"

      - name: AEI handshake
        run: |
          exe=bot_opfor; [ "$RUNNER_OS" = Windows ] && exe=bot_opfor.exe
          printf 'aei\nisready\nquit\n' | "./$exe" | tee aei.txt
          grep -q '^aeiok' aei.txt && grep -q '^readyok' aei.txt

      - name: Package
        run: |
          exe=bot_opfor; [ "$RUNNER_OS" = Windows ] && exe=bot_opfor.exe
          mkdir opfor
          cp "$exe" LICENSE.txt README.txt opfor/
          name="opfor-${{ matrix.platform }}.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$name" opfor >/dev/null
          else
            tar czf "$name" opfor
          fi
          echo "PACKAGE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Write the engine manifest
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, pathlib

          repo = os.environ["REPO"]
          is_tag = os.environ["IS_TAG"] == "true"
          tag = os.environ["REF_NAME"] if is_tag else "v0.0.0-test"
          version = tag.removeprefix("v")
          dist = pathlib.Path("dist")
          downloads = {}
          for f in sorted(dist.iterdir()):
              platform, _, archive = f.name.removeprefix("opfor-").partition(".")
              exe = "bot_opfor.exe" if platform.startswith("windows") else "bot_opfor"
              downloads[platform] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{f.name}",
                  "sha256": hashlib.sha256(f.read_bytes()).hexdigest(),
                  "archive": archive,
                  "program": f"opfor/{exe}",
              }
          manifest = {
              "manifest_version": 1,
              "id": f"github.com/{repo}",
              "name": "OpFor",
              "version": version,
              "author": "Brian Haskin (Janzert)",
              "description": "An alpha-beta Arimaa engine, bot_OpFor on arimaa.com.",
              "homepage": f"https://github.com/{repo}",
              "license": "MIT",
              "update_url": f"https://github.com/{repo}/releases/latest/download/engine.json",
              "downloads": downloads,
              "options": [
                  {"name": "hash", "type": "spin", "default": 10, "min": 1,
                   "description": "Transposition table size in megabytes. Not changed during a search."},
                  {"name": "threads", "type": "spin", "default": 1, "min": 1,
                   "description": "Search threads."},
              ],
          }
          (dist / "engine.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print((dist / "engine.json").read_text())
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "OpFor $TAG" \
              --notes "OpFor ${TAG#v}. Install it from a controller that reads engine manifests (engine.json), or unpack the archive for your platform and run bot_opfor."
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*

      - name: Check the published files against the manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, urllib.request

          base = f"https://github.com/{os.environ['REPO']}/releases/download/{os.environ['TAG']}"
          manifest = json.load(urllib.request.urlopen(f"{base}/engine.json"))
          for platform, d in manifest["downloads"].items():
              digest = hashlib.sha256(urllib.request.urlopen(d["url"]).read()).hexdigest()
              assert digest == d["sha256"], f"{platform}: {digest} != {d['sha256']}"
              print(f"{platform}: ok")
          EOF
